interface:
  display_name: "AI Software Architect"
  short_description: "Suggest project-fit patterns and guide architecture decisions"
  default_prompt: "Use $ai-software-architect to suggest project-fit patterns or guide a complete architecture workflow."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "ai-software-architect-mcp"
      description: "AI Software Architect MCP: read-only architecture evidence and validation"
      transport: "stdio"
