  developer_identity_to_verify_and_select: XAVIER MUFFATO LTDA
  legal_entity: XAVIER MUFFATO LTDA
  public_relationship: AUTOSOFT Engineering is a brand of XAVIER MUFFATO LTDA.
  website: https://www.autosoft-engineering.de
  support_url: https://github.com/leomuf/ai-software-architect/blob/main/SUPPORT.md
  privacy_policy_url: https://github.com/leomuf/ai-software-architect/blob/main/PRIVACY.md
  terms_of_service_url: https://github.com/leomuf/ai-software-architect/blob/main/TERMS.md
  repository_url: https://github.com/leomuf/ai-software-architect
plugin:
  name: AI Software Architect
  slug: ai-software-architect
  version_source: .codex-plugin/plugin.json
  portal_submission_type: Skills only
  package_features:
    - composite-skill
    - codex-lifecycle-hooks
  category_preference: Developer Tools
  short_description: >-
    Project-aware architecture and design-pattern guidance before implementation.
  description: >-
    AI Software Architect helps users choose suitable software architecture and
    design patterns before an AI coding assistant produces large amounts of code.
    It compares credible alternatives with explicit fit criteria, explains stored
    pattern examples, asks for approval, records validated ADRs and architecture
    artifacts, prepares coding handoffs, and performs read-only conformance reviews.
    The user's selected Codex model performs the reasoning. Transparent, short-lived
    local hooks reinforce activation, continuation, static inspection, guarded
    artifact writing, and response validation without network calls or a persistent
    service. The public, privacy-preserving evaluation history records more than
    350 eligible exploratory observations across more than 140 campaigns,
    complemented by more than 160 deterministic automated tests.
  update_release_notes: >-
    Update from version 0.2.2 to 0.2.3 under the AUTOSOFT Engineering brand by
    XAVIER MUFFATO LTDA. This version explicitly declares the bundled
    hooks/hooks.json configuration so public Codex plugin installations can
    discover, review, and activate all five lifecycle hooks. The project-aware
    architecture and design-pattern guidance, stored pattern examples,
    user-approved ADR and handoff artifacts, bounded static repository review,
    short-lived local runtime, and no-MCP design are otherwise unchanged.
  countries_and_regions:
    selection: confirm-in-portal
    intended: broadly-available-where-openai-plugin-directory-is-supported
  supported_surface:
    codex: full-skill-and-reviewed-hook-workflow
    other_openai_surfaces: skill-guidance-without-codex-hook-guarantees
starter_prompts:
  - Suggest suitable design patterns for my current project.
  - Give me Python examples of Abstract Factory.
  - Compare suitable architectures for this project.
