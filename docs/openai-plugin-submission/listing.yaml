  legal_entity: XAVIER MUFFATO LTDA
  public_relationship: AUTOSOFT Engineering is a brand of XAVIER MUFFATO LTDA.
  website: https://www.autosoft-engineering.de
  support_url: https://github.com/leomuf/ai-software-architect/blob/main/SUPPORT.md
  privacy_policy_url: https://github.com/leomuf/ai-software-architect/blob/main/PRIVACY.md
  terms_of_service_url: https://github.com/leomuf/ai-software-architect/blob/main/TERMS.md
