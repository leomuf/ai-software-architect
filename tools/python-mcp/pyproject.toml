[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "ai-architect-tools"
version = "0.2.2"
description = "Read-only deterministic MCP and CLI tools for AI Software Architect."
requires-python = ">=3.11,<3.14"
dependencies = [
  "ai-architect-schemas",
  "mcp>=1.27,<2",
  "pyyaml>=6.0,<7",
]
license = "MIT"

[project.scripts]
ai-architect-tools = "ai_architect_tools.cli:main"
ai-architect-mcp = "ai_architect_tools.mcp_server:main"

[tool.uv.sources]
ai-architect-schemas = { workspace = true }
