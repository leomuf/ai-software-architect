name: Release artifact

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.3"
          enable-cache: false
      - run: uv sync --locked --all-packages
      - run: uv run python tools/generate_third_party_notices.py
      - name: Build runtime before signing and assembly
        run: uv run python adapters/codex/build_plugin.py --build-runtime-only
      # A verified signing identity must be configured before publication.
      # Keep this gate closed until the chosen signing provider is integrated.
      - name: Require signed release binaries before recording provenance
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER_SUBJECT }}
        run: |
          .\scripts\check-windows-runtime-signatures.ps1 `
            -RuntimePath build/runtime/ai-architect-runtime `
            -ExpectedPublisherSubject $env:EXPECTED_PUBLISHER
      - name: Assemble exact tagged plugin from signed runtime
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          uv run python adapters/codex/build_plugin.py --runtime build/runtime/ai-architect-runtime --plugin-version $version
      - run: uv run python adapters/codex/validate_plugin.py dist/codex/ai-software-architect
      - name: Smoke-test packaged runtime
        run: uv run python adapters/codex/smoke_test_runtime.py dist/codex/ai-software-architect/runtime/windows-x86_64/ai-architect-runtime/ai-architect-runtime.exe
      - name: Create installable marketplace bundle
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          .\scripts\package-codex-release.ps1 -PluginVersion $version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-software-architect-${{ github.ref_name }}-windows-x86_64
          path: |
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error

  collect-release-assets:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ai-software-architect-${{ github.ref_name }}-*
          path: dist/platform-artifacts
          merge-multiple: false
      - name: Collect ZIPs and generate the publication checksum manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python scripts/collect_release_assets.py
          --source dist/platform-artifacts --output dist/release-assets
          --version "${RELEASE_TAG#v}" --target windows-x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist/release-assets/*
          if-no-files-found: error
