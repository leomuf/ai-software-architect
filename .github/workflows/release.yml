name: Release artifact

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.12"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.3"
          enable-cache: false
      - run: uv sync --locked --all-packages
      - run: uv run python tools/generate_third_party_notices.py
      - name: Build exact tagged plugin
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          uv run python adapters/codex/build_plugin.py --build-runtime --plugin-version $version
      - run: uv run python adapters/codex/validate_plugin.py dist/codex/ai-software-architect
      - name: Smoke-test packaged runtime
        run: uv run python adapters/codex/smoke_test_runtime.py dist/codex/ai-software-architect/runtime/windows-x86_64/ai-architect-runtime/ai-architect-runtime.exe
      - name: Create installable marketplace bundle
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          .\scripts\package-codex-release.ps1 -PluginVersion $version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-software-architect-${{ github.ref_name }}-windows-x86_64
          path: |
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
