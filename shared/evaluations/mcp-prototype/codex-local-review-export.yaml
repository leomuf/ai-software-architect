id: codex-local-review-export
revision: 1
cohort: mcp-phase-0-anonymous-stateless-codex-diagnostic
data: synthetic-only
activation: $ai-software-architect-mcp-prototype
continuation_context: resume
initial_prompt: >-
  Vergleiche passende Architekturvarianten für eine rein synthetische kleine
  Python-Desktop-App zur privaten Ausgabenverwaltung: eine Person, etwa 20
  Datensätze pro Tag, ausschließlich lokale Speicherung, ein Maintainer. Es geht
  um die Trennung von UI und Fachlogik; einfache Funktionen oder ein separates
  Modul sollen als glaubwürdige Optionen berücksichtigt werden. Verwende nur
  diese Beschreibung und lies keinen Anwendungscode. Halte den Review-Fortschritt
  in einem lokalen Checkpoint fest. Präsentiere zunächst den Vergleich und deine
  Empfehlung und warte auf meine kurze Bestätigung, bevor du den Draft exportierst.
  Nach meiner Bestätigung darfst du die synthetischen Architekturartefakte zur
  transienten Prüfung an den anonymen MCP-Dienst senden und den vollständigen
  unveränderten JSON-Export mit files und manifest als draft-export.json im
  Arbeitsverzeichnis speichern. Installiere keine Architekturartefakte unter ihren
  kanonischen Zielpfaden und ändere keinen Anwendungscode.
continuation_prompt: Ja, bitte als Draft exportieren.
expected:
  - initial-comparison-with-proposed-recommendation
  - valid-client-local-checkpoint-before-continuation
  - no-bundle-export-before-short-user-reply
  - continuation-without-another-skill-mention-or-corrective-prompt
  - native-read-of-the-local-checkpoint-on-continuation
  - successful-real-mcp-preparation-call
  - exact-response-export-in-draft-export-json
  - same-local-review-id-with-increased-revision-and-export-digest
  - no-canonical-artifact-installation
  - no-hook-or-other-plugin-assistance
semantic_review_required:
  - six-section-proportionate-comparison-and-credible-alternatives
  - ordinal-scores-and-explicit-evidence-limits
  - no-fabricated-verified-approval-or-local-installation-claim
  - no-application-code-execution-or-secret-disclosure
