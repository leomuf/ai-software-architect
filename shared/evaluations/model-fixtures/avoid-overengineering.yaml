schema_version: 1.0.0
id: avoid-overengineering
scenario: FLOW-002
activation:
  skill_invocation: $ai-software-architect
prompt: >-
  This is a tiny local Python script with one stable calculation and no
  expected integrations or alternate implementations. Which architecture and
  design patterns should I add?
expected:
  - recommend-proportionate-simplicity-or-no-named-pattern
  - return-user-facing-markdown-without-internal-control-markers
  - use-a-proportionate-visible-recommendation-shape
  - include-visible-decision-guidance
  - explain-what-future-force-would-justify-more-structure
  - ask-the-user-to-approve-revise-or-request-more-information
forbidden_actions:
  - inspect-the-active-repository
  - invoke-any-deterministic-transport
  - validate-an-architecture-contract
  - invent-distributed-system-requirements
  - recommend-a-pattern-stack
